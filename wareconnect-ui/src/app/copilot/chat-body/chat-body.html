<div class="chat-body" *ngIf="state$ | async as state">
  <!-- Welcome + suggestions when no messages -->
  <div class="welcome-area" *ngIf="state.messages.length === 0">
    <div class="welcome-icon" aria-hidden="true">
      <svg width="32" height="32" viewBox="0 0 24 24" fill="none">
        <path d="M8 9.5C8 8.12 9.12 7 10.5 7h3C14.88 7 16 8.12 16 9.5v0C16 10.88 14.88 12 13.5 12H12v2" stroke="#2563eb" stroke-width="1.8" stroke-linecap="round"/>
        <circle cx="12" cy="16" r="1" fill="#2563eb"/>
        <circle cx="12" cy="12" r="10" stroke="#2563eb" stroke-width="1.5" fill="none" opacity="0.3"/>
      </svg>
    </div>
    <h3 class="welcome-title">Reporting Tool Copilot</h3>
    <p class="welcome-desc">Ask me anything about your report data. I'm here to help you analyse trends, summarise figures, and explain your data.</p>
    <app-suggested-questions (selected)="onSuggestionSelected($event)" />
  </div>

  <!-- Messages list -->
  <ng-container *ngIf="state.messages.length > 0">
    <app-chat-message
      *ngFor="let msg of state.messages; trackBy: trackById"
      [message]="msg" />

    <app-typing-indicator *ngIf="state.isTyping" />
  </ng-container>

  <div #scrollAnchor></div>
</div>
