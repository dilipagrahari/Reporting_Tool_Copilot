<div class="message-row" [ngClass]="{ 'user-row': isUser, 'ai-row': !isUser }">
  <!-- AI avatar -->
  <div class="message-avatar" *ngIf="!isUser" aria-hidden="true">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none">
      <path d="M8 9.5C8 8.12 9.12 7 10.5 7h3C14.88 7 16 8.12 16 9.5C16 10.88 14.88 12 13.5 12H12v2" stroke="white" stroke-width="1.8" stroke-linecap="round"/>
      <circle cx="12" cy="16" r="1" fill="white"/>
    </svg>
  </div>

  <div class="message-bubble" [ngClass]="{ 'user-bubble': isUser, 'ai-bubble': !isUser }">
    <!-- User message: plain text -->
    <span *ngIf="isUser" class="user-text">{{ message.content }}</span>

    <!-- AI message: rendered markdown -->
    <app-markdown-renderer *ngIf="!isUser" [content]="message.content" />

    <!-- Streaming cursor -->
    <span class="cursor" *ngIf="message.isStreaming" aria-hidden="true"></span>

    <!-- Footer -->
    <div class="message-footer" [ngClass]="{ 'user-footer': isUser }">
      <span class="message-time">{{ message.timestamp | date: 'h:mm a' }}</span>
      <button
        class="copy-btn"
        *ngIf="!isUser && !message.isStreaming"
        (click)="onCopy()"
        [title]="copySuccess ? 'Copied!' : 'Copy'"
        [attr.aria-label]="copySuccess ? 'Copied' : 'Copy response'">
        <svg *ngIf="!copySuccess" width="13" height="13" viewBox="0 0 24 24" fill="none">
          <rect x="9" y="9" width="13" height="13" rx="2" stroke="currentColor" stroke-width="1.8"/>
          <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1" stroke="currentColor" stroke-width="1.8"/>
        </svg>
        <svg *ngIf="copySuccess" width="13" height="13" viewBox="0 0 24 24" fill="none">
          <path d="M20 6L9 17l-5-5" stroke="#22c55e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        <span class="copy-label" *ngIf="copySuccess">Copied</span>
      </button>
    </div>
  </div>
</div>
